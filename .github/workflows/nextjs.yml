name: Verify Next.js server
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Read installed Next.js conventions
        run: |
          test -d node_modules/next/dist/docs
          find node_modules/next/dist/docs -iname '*proxy*' -type f -exec cat {} \;
      - run: npm run build
      - name: Verify admin HTTP authentication
        run: node scripts/admin-smoke.mjs
